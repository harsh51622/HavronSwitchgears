<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WhatsApp-style Chat Widget (Responsive)</title>
  <link rel="stylesheet" href="chat.css">
</head>

<body>

  <!-- Floating WhatsApp-style icon -->
<!-- Floating WhatsApp Icon -->
<div class="wa-float" id="waToggle" title="Chat with us">
  <i class="fab fa-whatsapp"></i>
</div>


  <!-- Chat container -->
  <div class="chat-container" id="chatPanel" aria-hidden="true">
    <div class="chat-top">
      <img src="/IMAGES/sliderimages/network-and-Infra.jpg" alt=""
        style="width:44px;height:44px;border-radius:8px;background:var(--glass)" />
      <div>
        <div class="title">Customer Support</div>
        <div class="status" id="botStatus">Usually replies within a minute</div>
      </div>
      <button class="close-btn" id="closeChat" aria-label="Close chat">✕</button>
    </div>

    <div class="messages" id="messages" role="log" aria-live="polite"></div>

    <div class="quick-links" id="quickLinks">
      <button data-q="products">Products</button>
      <button data-q="about">About</button>
      <button data-q="contact">Contact</button>
      <button data-q="pricing">Pricing</button>
      <button data-q="hours">Hours</button>
    </div>

    <div class="composer">
      <input id="userInput" type="text" placeholder="Type a message or ask something..." aria-label="Message input" />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <!-- Enquiry panel -->
  <div class="enquiry-panel" id="enquiryPanel">
    <div class="head">Enquiry Form
      <button class="enquiry-close" onclick="toggleEnquiry(false)">×</button>
    </div>

    <form action="https://api.web3forms.com/submit" method="POST"
          style="background-color:#fff; padding:20px; border:2px solid #007BFF;  
                 border-radius:8px; display:flex; flex-direction:column; gap:12px; 
                 width:90%; max-width:400px; min-width:250px; position:relative; 
                 box-sizing:border-box;">

      <!-- 🔴 Close Button -->
      <button type="button" id="closeBtnPanel" 
              style="position:absolute; top:10px; right:10px; 
                     background:none; border:none; font-size:24px; cursor:pointer;">
        &times;
      </button>

      <h2 style="text-align:center; margin-bottom:10px;">Enquiry Form</h2>       

      <input type="hidden" name="access_key" value="640ae93f-ac1b-492d-a019-3e2c20b1f96d">

      <input type="text" name="name" required placeholder="Your Name"
             style="padding:10px; border:1px solid #ccc; border-radius:4px; font-size:16px;">

      <input type="email" name="email" required placeholder="Your Email"
             style="padding:10px; border:1px solid #ccc; border-radius:4px; font-size:16px;">

      <input type="tel" name="phone" required placeholder="Your Phone Number"    
             style="padding:10px; border:1px solid #ccc; border-radius:4px; font-size:16px;">

      <textarea name="message" required placeholder="Your Message" rows="2"      
                style="padding:10px; border:1px solid #ccc; border-radius:4px; font-size:16px; resize:vertical;"></textarea>

      <button type="submit"
              style="padding:12px; background-color:#007BFF; color:white;        
                     border:none; border-radius:5px; cursor:pointer; font-size:16px;">
        Submit Form
      </button>

    </form>
  </div>

  <script src="chat.js">

  </script>

<script>
// 🔹 Close Enquiry Panel
const closeBtnPanel = document.getElementById('closeBtnPanel');

closeBtnPanel.addEventListener('click', (e) => {
  e.preventDefault();
  enquiryPanel.style.display = 'none';
});
</script>
</body>

</html>
